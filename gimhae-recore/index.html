<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>김해 원도심 RE:CORE 통합 안내</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%2322406A'/%3E%3Cpath d='M7 27c3.2-7.8 7.4-11.7 13-11.7S29.8 19.2 33 27' fill='%234F8468'/%3E%3Cpath d='M5 27.5h30' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='16.5' y='21' width='7' height='6.5' rx='1' fill='%23B85C35'/%3E%3Ccircle cx='29' cy='11' r='2.6' fill='%23F4D58D'/%3E%3C/svg%3E">
<style id="gate-style">
  @font-face{font-family:"Pretendard";font-weight:400;src:url(vendor/pretendard-1.3.9/woff2/Pretendard-Regular.woff2) format("woff2")}
  @font-face{font-family:"Pretendard";font-weight:700;src:url(vendor/pretendard-1.3.9/woff2/Pretendard-Bold.woff2) format("woff2")}
  :root{color-scheme:light}
  html,body{margin:0;min-height:100%;background:#fff;color:#18212C;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px 0;box-sizing:border-box;position:relative;overflow:hidden}
  .gate::before{content:"";position:absolute;inset:auto 0 0 0;height:46vh;background:url(gate.webp) center 70%/cover no-repeat;opacity:.95;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
  .logo{width:52px;height:52px;margin-bottom:14px}
  .kicker{font-size:15px;font-weight:700;color:#B85C35;letter-spacing:.04em}
  h1{font-size:34px;line-height:1.25;margin:8px 0 6px;text-align:center;letter-spacing:-.02em}
  h1 b{color:#B85C35}
  .sub{margin:0 0 22px;color:#5B6573;font-size:16px;text-align:center;line-height:1.6}
  form{position:relative;z-index:2;width:min(380px,100%);background:#fff;border:1px solid #E5E1D9;border-radius:18px;padding:24px 22px 18px;box-shadow:0 2px 4px rgba(24,33,44,.06),0 18px 50px rgba(24,33,44,.12);box-sizing:border-box}
  label{display:block;font-size:15px;font-weight:700;margin-bottom:8px}
  input[type=password]{width:100%;box-sizing:border-box;height:50px;padding:0 14px;border-radius:12px;border:1px solid #D6D0C5;background:#FAF8F4;font-size:17px;font-family:inherit}
  input[type=password]:focus{outline:3px solid rgba(34,64,106,.3);border-color:#22406A;background:#fff}
  .row{display:flex;align-items:center;gap:8px;margin:12px 0 14px;font-size:15px;color:#5B6573}
  .row input{width:18px;height:18px;accent-color:#22406A}
  .row label{display:inline;font-weight:400;margin:0}
  button{width:100%;height:50px;border:0;border-radius:12px;background:#22406A;color:#fff;font-weight:700;font-size:17px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(34,64,106,.25)}
  button:disabled{opacity:.6;cursor:wait}
  .err{min-height:20px;margin-top:10px;font-size:14px;color:#C2412F}
  .foot{margin-top:10px;font-size:13px;color:#8A929C;line-height:1.55}
  .spacer{height:34vh}
  @media (max-width:640px){h1{font-size:27px}.gate::before{height:36vh}.spacer{height:24vh}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#22406A"/><path d="M7 27c3.2-7.8 7.4-11.7 13-11.7S29.8 19.2 33 27" fill="#4F8468"/><path d="M5 27.5h30" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="16.5" y="21" width="7" height="6.5" rx="1" fill="#B85C35"/><circle cx="29" cy="11" r="2.6" fill="#F4D58D"/></svg>
  <div class="kicker">2027 거점특화 원도심 시범사업</div>
  <h1>김해 원도심 <b>RE:CORE</b><br>사업 준비 통합 안내</h1>
  <p class="sub">담당자용 안내판입니다. 받으신 비밀번호를 넣어 주세요.</p>
  <form id="f" autocomplete="on">
    <label for="pw">비밀번호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <div class="row"><input id="keep" type="checkbox" checked><label for="keep">이 기기에서 30일 동안 기억</label></div>
    <button id="go" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
    <div class="foot">내용·그림·문서는 모두 암호화돼 있어 비밀번호 없이는 열리지 않습니다. 갱신 2026-10-10 02:46</div>
  </form>
  <div class="spacer"></div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (u) => { const a = new Uint8Array(u); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const KEEP = 'gm-key', KEEP_TAB = 'gm-key-tab';
  let pack = null;
  async function getPack() { if (!pack) { const r = await fetch('app.bin', { cache: 'no-cache' }); if (!r.ok) throw new Error('자료 파일을 받지 못했습니다(' + r.status + ')'); pack = await r.json(); } return pack; }
  async function keyFrom(pw, p) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(key, p) { const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.ct)); return JSON.parse(new TextDecoder().decode(plain)); }
  function boot(app, key) {
    const BASE = location.pathname.replace(/[^/]*$/, '');
    const files = app.files, real = window.fetch.bind(window);
    window.__BUILT = app.built;
    window.fetch = async (input, init) => {
      try {
        const u = new URL(typeof input === 'string' ? input : input.url, location.href);
        if (u.origin === location.origin && u.pathname.startsWith(BASE)) {
          const rel = decodeURIComponent(u.pathname.slice(BASE.length));
          if (Object.prototype.hasOwnProperty.call(files, rel)) return new Response(files[rel], { status: 200, headers: { 'content-type': 'application/json' } });
        }
      } catch (e) { /* 원래 fetch 로 */ }
      return real(input, init);
    };
    const cache = new Map();
    window.__ASSET = (rel) => {
      const a = app.assets[rel];
      if (!a) return Promise.resolve(rel);
      if (!cache.has(rel)) cache.set(rel, (async () => {
        const r = await real('a/' + a.id + '.bin');
        if (!r.ok) throw new Error('파일을 받지 못했습니다');
        const buf = new Uint8Array(await r.arrayBuffer());
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, key, buf.subarray(12));
        return URL.createObjectURL(new Blob([plain], { type: a.type }));
      })());
      return cache.get(rel);
    };
    document.getElementById('gate-style')?.remove();
    const st = document.createElement('style'); st.textContent = app.css; document.head.appendChild(st);
    document.body.innerHTML = '';
    const sc = document.createElement('script'); sc.textContent = app.js; document.body.appendChild(sc);
  }
  function rememberTab(raw, salt) { try { sessionStorage.setItem(KEEP_TAB, JSON.stringify({ k: raw, salt })); } catch (_) {} }
  async function tryKeep() {
    for (const [store, name] of [[sessionStorage, KEEP_TAB], [localStorage, KEEP]]) {
      try {
        const k = JSON.parse(store.getItem(name) || 'null');
        if (!k || (k.exp && Date.now() > k.exp)) continue;
        const p = await getPack();
        if (k.salt !== p.salt) continue;
        const key = await crypto.subtle.importKey('raw', b64(k.k), { name: 'AES-GCM' }, false, ['decrypt']);
        const app = await open(key, p);
        rememberTab(k.k, p.salt);
        boot(app, key); return true;
      } catch (e) { try { store.removeItem(name); } catch (_) {} }
    }
    return false;
  }
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('go').disabled = true; $('err').textContent = ''; $('go').textContent = '여는 중…';
    try {
      const p = await getPack();
      const key = await keyFrom($('pw').value.trim(), p);
      let app;
      try { app = await open(key, p); } catch (_) { throw new Error('비밀번호가 다릅니다. 다시 확인해 주세요.'); }
      const raw = toB64(await crypto.subtle.exportKey('raw', key));
      rememberTab(raw, p.salt);
      if ($('keep').checked) { try { localStorage.setItem(KEEP, JSON.stringify({ k: raw, salt: p.salt, exp: Date.now() + 30 * 864e5 })); } catch (_) {} }
      boot(app, key);
    } catch (err) { $('err').textContent = err.message || String(err); $('go').disabled = false; $('go').textContent = '열기'; }
  });
  tryKeep();
})();
</script>
</body>
</html>
