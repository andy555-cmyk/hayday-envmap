,"pages":[64,90]},{"what":"유의사항은 문화사업 예산기준을 본문 86쪽으로 안내하지만 이 91쪽 문서의 본문은 85쪽에서 끝나고 해당 기준은 PDF 91쪽·본문 85쪽에 있음","pages":[35,91]}]},"faq":[{"q":"누가 신청하고, 어디로 내나요?","a":"사업을 추진하려는 기초지자체가 계획을 만들고, 시·도가 자체 평가한 뒤 국토교통부에 신청합니다. 공문은 시·도가 취합해 보내고, 전자파일은 도시재생종합정보체계에 올립니다.","page":28},{"q":"경상남도는 몇 곳을 올릴 수 있나요?","a":"상세 신청방법에는 일반 시·도는 1곳, 통합특별시·특별자치도는 2곳을 제출할 수 있다고 적혀 있습니다. 다만 앞쪽에는 광역별 1~2곳이라고 달리 적혀 있어 2026년 12월 재공고 확인이 필요합니다.","page":28},{"q":"어떤 지역이 신청할 수 있나요?","a":"현행 도시·군기본계획의 도심 또는 부도심에 속하고, 도시재생법상 쇠퇴 요건을 충족해야 합니다. 주요가로에 공실상가 10호 이상이 있어야 하며 수도권은 제외됩니다.","page":12},{"q":"사업구역이 15만㎡를 넘으면 탈락하나요?","a":"15만㎡ 이내는 의무 상한이 아니라 권장 기준으로 적혀 있습니다. 도시와 원도심 규모를 고려해 자율 설정하되 사업의 직접효과를 고려하라고만 되어 있으므로, 초과하는 안을 택할 경우 사전컨설팅에서 그 근거를 미리 확인하는 것이 안전합니다.","page":12},{"q":"기존 도시재생사업 지역과 겹쳐도 신청할 수 있나요?","a":"기존 국비 지원이 끝났고 이번 신청지역과 과거 국비 투입지역을 구분할 수 있으면 신청할 수 있습니다. 국비 지원이 아직 끝나지 않은 기존 선정지역은 제외되며, 기존 활성화계획 구역은 전략계획 변경이 필요할 수 있습니다.","page":12},{"q":"공실상가 10호는 어떻게 세나요?","a":"구역 안 주요가로에 접한 점포를 세며, 가로는 연결된 1개 노선이어야 합니다. 한 점포의 일부만 비어 있는 부분공실도 호수에 포함할 수 있습니다.","page":27},{"q":"‘2026년 1월 1일 이전부터 공실’은 무슨 뜻인가요?","a":"2026년 1월 1일이 되기 전부터 이미 비어 있었고, 신청 때까지 그 상태가 이어졌음을 뜻합니다. 현재 사진만으로는 부족하므로 과거부터 비어 있었다는 자료를 함께 내야 합니다.","page":27},{"q":"공실은 무엇으로 증명하나요?","a":"먼저 현장조사와 공인중개사·상인회·주민 인터뷰로 후보를 가립니다. 그 뒤 수도·전기 사용량 저조, 영업자료 미발생, 1년 단위 반복 미사용 가운데 2개 이상을 충족해야 합니다.","page":27},{"q":"준공 뒤 한 번도 쓰지 않은 점포도 공실 10호에 넣나요?","a":"가이드라인은 준공 후 계속 비어 있던 점포를 공실 10호 기준에서 제외한다고 적고 있습니다. 실제 영업이나 사용 뒤 1년 이상 비어 있는 점포인지 확인해야 합니다.","page":12},{"q":"신청할 때 공실 10호는 후보만 있으면 되나요?","a":"아닙니다. 신청 때 주요가로 인근에서 바로 활용할 수 있는 10호 이상을 확보해야 합니다. 조건부 권원 확보나 상생협약 상태라면 최종평가 전인 2027년 2월까지 최종 권원을 확보해야 합니다.","page":15},{"q":"사전컨설팅은 꼭 받아야 하나요?","a":"필수입니다. 주택도시보증공사 상담 3회와 문화체육관광부 상담 1회, 모두 4회를 2026년 9월부터 12월 사이에 진행하도록 되어 있습니다.","page":27},{"q":"한 지역이 받을 수 있는 최대 지원 규모는 얼마인가요?","a":"지역당 국비는 최대 242.4억원이고, 지방비를 합친 총사업비는 최대 364.8억원입니다. 국토부 사업은 국비 70%·지방비 30%, 문체부 두 사업은 각각 국비 50%·지방비 50%이며, 지원기간은 최대 4년입니다.","page":13},{"q":"부지와 상가 매입비는 얼마까지 넣을 수 있나요?","a":"국토교통부 도시재생 재정보조 사업비, 즉 국비와 지방비 합계의 50%를 넘을 수 없습니다. 문체부 예산까지 포함한 364.8억원 전체를 기준으로 계산하면 안 됩니다.","page":81},{"q":"상생형 상가 임대료는 얼마나 지원하나요?","a":"사업기간 안에서 최대 48개월 동안 계약 임대료의 최대 90%를 지원할 수 있습니다. 사업이 끝난 뒤에는 자체 지방비로 지원이 끊기지 않도록 운영계획을 세워야 합니다.","page":85},{"q":"상가와 시설은 몇 년 운영해야 하나요?","a":"상생형은 10년 이상 계약 또는 협약이 필요하고, 매입형과 상생형 모두 조성 후 최소 10년 운영계획을 세워야 합니다. 앞쪽 요약의 ‘최대 10년’ 문구와 달라 최종 공고에서 확인이 필요합니다.","page":[10,15]},{"q":"문화체육관광부 사업은 국토교통부 사업과 따로 하나요?","a":"신청계획은 도시재생활성화계획과 문화콘텐츠활성화계획을 함께 구성합니다. 선정 뒤 문체부 사업은 먼저 추진할 수 있지만, 국토부 사업은 도시재생특별위원회 심의 뒤 추진해야 합니다.","page":12},{"q":"첫해 팝업스토어는 언제 준비해야 하나요?","a":"2027년 7~9월까지 팝업스토어와 연계 프로그램을 위한 공실 정비를 마쳐야 합니다. 첫해 팝업은 4분기에 1회, 4주 동안 진행하는 계획입니다.","page":19},{"q":"입주 청년 활동비 조건은 무엇인가요?","a":"콘텐츠 창업자와 창작자에게 월 30만원을 지역화폐로 지급합니다. 월 30시간 이상 공간 체류와 월간 창업·창작 보고서가 필요하며, 연말 성과물 전시는 원문 안에서 필수 여부가 서로 다르게 적혀 있습니다.","page":20},{"q":"사업은 어떤 조직이 운영하나요?","a":"단체장 또는 부단체장이 이끄는 행정협의회를 두고 도시재생·문화 부서와 전문기관이 함께 참여합니다. 현장지원센터가 전체 사업과 상생협약상가 운영을 돕고, 문화사업은 지역 전문기관에 맡길 수 있습니다.","page":21},{"q":"평가는 어떤 순서로 진행하나요?","a":"사전 적격성 검증 뒤 서면검토, 현장실사, 발표평가를 거쳐 선정합니다. 발표평가는 보완한 사업계획을 바탕으로 발표자료와 질문·답변 방식으로 진행합니다.","page":29},{"q":"평가 배점은 어떻게 되나요?","a":"국토부 계획은 사업 타당성 15점, 계획 합리성 60점, 사업효과 25점으로 100점입니다. 문체부 계획도 별도 100점 평가표가 있지만 두 점수를 최종적으로 어떻게 합치는지는 원문에 적혀 있지 않아 확인이 필요합니다.","page":[31,33]},{"q":"가점은 무엇이 있나요?","a":"공실 10호 초과 확보 최대 3점, 국비 지원이 끝난 문화도시 최대 3점, 창업도시 연계 3점이 있습니다. 가시화된 공공임대주택을 청년·창업인·문화예술인 입주와 연결하면 사업 건당 1점입니다.","page":34},{"q":"공고·접수·선정 일정은 어떻게 되나요?","a":"공고는 2026년 12월, 접수는 2027년 1월, 평가는 1~2월, 선정 발표는 2월 잠정입니다. 예산안이 확정되면 공고·접수·평가 일정을 다시 알릴 예정입니다.","page":27},{"q":"선정되지 않으면 다음 해 다시 평가받을 수 있나요?","a":"평가위원회가 후보지로 분류한 미선정 사업은 다음 연도 평가대상으로 계속 관리합니다. 다만 자동 재신청이나 자동 선정이라고 적힌 것은 아니므로 다음 공고의 절차를 확인해야 합니다.","page":29},{"q":"김해시가 부담할 지방비는 얼마인가요?","a":"지역당 총사업비 364.8억원 중 국비 242.4억원을 뺀 최대 122.4억원이 지방비입니다(국토부 사업 90억원, 문체부 두 사업 24억원·8.4억원). 입주 청년 활동비는 1·2년차에 매칭 지방비로 지급되고, 상생형 임대료 지원도 사업기간 이후에는 자체 지방비로 이어 가야 합니다. 사업신청서 사업비 표는 시도비·시군구비를 나누어 적게 되어 있어 경상남도와 분담 협의가 필요합니다.","page":[13,19]},{"q":"공실 조사는 확보할 10호만 하면 되나요?","a":"사업계획서에는 사업구역 안 점포 전수조사가 원칙이며, 도로변뿐 아니라 상층부·골목·시장 내부 점포까지 건물·층·호 단위로 고유번호를 붙여 조사하고 반복조사와 행정자료로 교차검증해야 합니다. 영업·공실·휴업·창고·공사 중·계절영업·법적 분쟁을 구분해 일시적 미사용 점포가 공실에 섞이지 않게 관리합니다. 결과는 별지 제1호(상가 총괄현황·공실상가 현황표)로 계획서에 넣고 점포별 조사대장과 증빙은 별첨합니다.","page":[46,70]},{"q":"조건부 매매계약서·상생협약서는 정해진 양식이 있나요? 어디까지 확보로 인정되나요?","a":"가이드라인에 원도심 활성화 표준 상생협약서(71쪽)와 조건부 매매계약서 양식(75쪽)이 실려 있어 필요한 부분만 조정해 쓸 수 있습니다. 매입협의로 인정받으려면 가격이 제시된 조건부 매매계약서 또는 10년 이상 조건부 임대계약서가 필요하고, 매입완료는 계약서와 계약금 지급 내역 또는 등기부 등본으로 입증합니다. 국·공유지는 매매 가능 여부가 담긴 공문·협약서로 대신합니다.","page":[32,71,75]},{"q":"선정되면 시가 바로 해야 하는 일이 있나요? 미리 쓴 지방비는 인정되나요?","a":"선정 후 2027년 상반기에 팝업스토어·청년 창작 공간용 공실 1~2개소를 지자체가 먼저 정비해야 하며, 국토부 사업은 도시재생특별위원회 심의(2027년 상반기) 이후 본격 추진합니다. 계획수립비·의견수렴비·부지매입비 등 먼저 집행한 지방비는 활성화계획에 반영돼 국비 지원이 결정된 단위사업에 한해 지방비 매칭에 포함되며, 부지·상가 매입비는 심의 결정·발표일 기준 3년 이내 매입분이 대상입니다.","page":35},{"q":"사업계획서 작성·제출에 정해진 형식이 있나요?","a":"계획서는 한글(hwp)로만 편집하고 hwp와 pdf를 함께 압축해 도시재생종합정보체계(www.city.go.kr)에 올리며, 업무사용자로 사전 등록이 필요합니다. 파일명은 “원도심 RECORE 프로젝트_사업신청서/사업계획/증빙자료_광역명_기초명” 형식이고 특수문자는 ‘_’만 쓸 수 있습니다. 책자는 양면인쇄 좌편철, 전체 사업계획도는 A3로 작성해 A4로 접어 첨부하며, 해당 지역과 무관한 해외·타지역 사진은 쓸 수 없습니다.","page":28},{"q":"계획 수립 용역비나 운영 인건비도 국비로 쓸 수 있나요?","a":"계획수립 용역비·자문비는 지방비로 먼저 집행하고(국비 신청액의 2% 이내 편성), 특별위원회에서 국비 지원이 결정된 뒤 지방비 매칭에 포함됩니다. 문체부 사업은 단순 인건비, 행정협의체 운영비, 계획 수립용 컨설팅·용역, 일회성 포럼, 홍보물·기념품 등에 국비를 쓸 수 없고, 국토부 사업도 행사성 비용·기관 운영비·시설 내 집기 등은 집행 금지입니다. 거버넌스·시설 운영주체·지원센터 운영비는 총사업비의 5% 이내입니다.","page":[82,91]},{"q":"팝업스토어는 누가 운영하고 시는 무엇을 준비하나요?","a":"팝업스토어는 문체부(한국콘텐츠진흥원)가 IP를 선정해 일괄 진행하고, 연계 프로그램은 지역 콘텐츠 거점기관이 집행하되 지자체가 전체 로드맵과 공간을 책임집니다. 시는 1층·쇼윈도가 있는 200~350㎡ 공실 후보 2곳 이상을 2027년 9월까지 정비해 두어야 하며, 1년차는 1개월 운영이라 주변 시설 임대로 대신할 수도 있습니다. 3년차 이후 팝업은 필요하면 자체 재원으로 운영합니다.","page":[20,54]},{"q":"상가 매입 가격과 임대 시세는 어떻게 정하나요?","a":"매입 취득가액은 행정안전부 공유재산 업무편람에 따라 2인 이상 감정평가액과 공시지가 등을 고려해 소유자와 협의로 정하며, 조건부 매매계약서 양식도 2인 이상 감정평가액의 산술평균을 매매대금으로 적도록 되어 있습니다. 임대료 지원 기준이 되는 임대 시세는 2인 이상 감정평가 또는 상인회·공인중개사·감정평가사로 구성된 위원회에서 결정합니다.","page":[75,81]}],"terms":[{"term":"4극3특","def":"이 사업이 지역을 나누는 권역 틀입니다. 2027년에는 권역별 1곳씩 총 7곳을 뽑을 계획입니다.","page":27},{"term":"원도심 복합재생","def":"국토교통부가 공실상가·유휴건물·거리와 기반시설을 고치는 공간 중심 사업입니다.","page":10},{"term":"원도심 문화콘텐츠 활성화","def":"문화체육관광부가 지역 대표 콘텐츠, 팝업, 청년 창작·창업 활동을 지원하는 사업입니다.","page":11},{"term":"도시재생활성화지역","def":"도시재생을 집중 추진하도록 법과 계획에 따라 정한 구역입니다. 기존 구역과 겹치면 국비 지원 종료와 실제 투자구역 분리 여부를 확인해야 합니다.","page":12},{"term":"쇠퇴지역","def":"인구 감소, 사업체 수 감소, 노후건축물 증가 가운데 2개 이상에 해당하는 지역입니다.","page":12},{"term":"공실상가","def":"이 사업에서는 2026년 1월 1일 이전부터 비어 있었음이 조사와 자료로 확인된 상가를 뜻합니다.","page":27},{"term":"부분공실","def":"한 상가나 건물 전체가 아니라 일부 층·호만 비어 있는 상태입니다. 신청요건의 공실상가 호수에 포함할 수 있습니다.","page":27},{"term":"주요가로","def":"사업 효과를 모을 중심 상업거리입니다. 신청요건에서는 공실상가가 접한 연결된 1개 노선으로 봅니다.","page":27},{"term":"권원","def":"지자체가 해당 상가나 부지를 사거나 빌려 실제로 쓸 수 있는 법적 권리와 계약 상태입니다.","page":32},{"term":"매입형","def":"지자체가 공실상가 등을 사서 고쳐 공급하는 방식입니다. 필요하면 새로 짓거나 빈집 용도를 바꿀 수 있습니다.","page":15},{"term":"상생형","def":"지자체가 상가를 직접 빌리거나 임대인·지자체·임차인이 협약해 저렴하게 쓰는 방식입니다.","page":15},{"term":"직접임대","def":"지자체가 임대인과 10년 이상 계약한 뒤 청년·문화인에게 낮은 부담으로 공간을 제공하는 방식입니다.","page":15},{"term":"3자 상생협약","def":"임대인·지자체·임차인이 임대기간과 임대료 상한 등을 함께 정하는 약속입니다.","page":15},{"term":"원도심 활성화상가","def":"공실상가를 고쳐 청년·문화예술인 등의 작업·창업공간으로 저렴하게 공급하는 상가입니다.","page":15},{"term":"특화거점","def":"원도심 활성화의 방향을 잡고 핵심 기능을 맡는 중심 시설입니다. 공실상가 활용과 거리 환경개선을 함께 묶어야 합니다.","page":16},{"term":"행정협의회","def":"단체장 또는 부단체장을 중심으로 도시재생·문화 부서와 전문기관이 함께 결정하고 협력하는 조직입니다.","page":21},{"term":"도시재생현장지원센터","def":"현장에서 사업 추진, 특화거점, 상생협약상가, 다른 부처 연계사업을 돕는 지원조직입니다.","page":21},{"term":"지역거점기관","def":"지역의 문화콘텐츠 사업을 실제 집행하는 전문기관입니다. 콘텐츠진흥원이나 지역 콘텐츠 기관 등이 해당될 수 있습니다.","page":13},{"term":"대표콘텐츠","def":"원도심을 방문하고 머물 이유가 되도록 골라 집중적으로 키우는 지역의 문화콘텐츠입니다.","page":18},{"term":"문화자원","def":"문학·미술·음악 같은 문화예술과 관광·전통·역사·영상 등 콘텐츠로 키울 수 있는 지역 자원입니다.","page":18},{"term":"팝업스토어","def":"인기 콘텐츠를 짧은 기간 전시·판매·체험하게 해 사람을 불러오는 임시 공간입니다.","page":19},{"term":"연계프로그램","def":"팝업과 함께 운영하는 체험·교육·수업·북콘서트 같은 프로그램입니다.","page":19},{"term":"IP","def":"캐릭터·웹툰처럼 이름과 이야기를 여러 상품과 행사에 활용할 수 있는 콘텐츠 권리입니다.","page":19},{"term":"사전컨설팅","def":"신청 전에 계획을 미리 점검받는 필수 사전컨설팅입니다. 주택도시보증공사 3회와 문체부 1회가 필요합니다.","page":29},{"term":"사전적격성 검증","def":"본평가 전에 법정요건, 신청기준, 공실 확보, 수요조사, 예산기준 등을 통과했는지 확인하는 절차입니다.","page":30},{"term":"서면검토","def":"제출한 계획서와 증빙자료를 평가위원이 문서로 먼저 살펴보는 단계입니다.","page":29},{"term":"현장실사","def":"서면검토 기간에 평가위원이 대상지를 직접 확인하는 단계입니다.","page":29},{"term":"발표평가","def":"보완한 사업계획을 발표자료로 설명하고 평가위원 질문에 답하는 단계입니다.","page":29}],"requirements":[{"id":"r1","icon":"img/req_area.webp","kind":"필수","title":"입지 — 비수도권 도심·부도심","page":12,"rule":"비수도권이면서 현행 도시·군기본계획상 도심 또는 부도심에 속해야 합니다.","now":"김해 원도심(봉황동·부원동 일대)으로 비수도권은 충족. 새 구역계가 도시기본계획 도심 범위 안인지 도면 대조가 남았습니다.","status":"chk","evidence":"대상지 기준점: 가락로50번길 17(부원동 706-16)","next":"도시기본계획 도심·부도심 도면에 확정 구역계 겹쳐 확인","who":"김해시(도시계획) · 용역사"},{"id":"r2","icon":"img/req_area.webp","kind":"필수","title":"쇠퇴 요건 — 3개 중 2개 이상","page":12,"rule":"인구 감소·사업체 수 감소·노후건축물 증가 가운데 둘 이상을 충족해야 합니다(도시재생법 시행령 제17조).","now":"원도심 3동 사업체 수 2021년 5,410개 → 2024년 5,120개(−5.4%, 3년 연속 감소), 20년 이상 노후건축물 93.3%(①안 기준)로 2개 요건 충족으로 분석했습니다.","status":"ok","evidence":"김해시 읍면동 사업체 수(2016~2024), 건축물대장 기반 건물 10,065동 분석(8/17·10/8)","next":"최종 구역계 확정 후 같은 방법으로 재산정해 신청서에 첨부","who":"용역사","risk":"법정 판정은 읍면동 자료 기준입니다. 인구 요건(원도심 3동 2015→2025 −14.0%)만으로 충족을 주장하지 않습니다."},{"id":"r3","icon":"img/req_area.webp","kind":"권장","title":"사업 면적 15만㎡ 이내","page":12,"rule":"공실상가가 밀집한 15만㎡ 이내를 권장하며, 도시·원도심 규모를 고려해 자율 설정하되 사업의 직접효과를 고려하도록 합니다(초과 시 그 근거를 계획서에 설명하는 것은 용역사 권고).","now":"구역계 후보 ①안 145,620㎡(13곳 모두 포함)는 충족, ②안 177,371㎡·③안 190,221㎡는 초과입니다. 10월 15일 실무회의에서 고릅니다.","status":"ing","evidence":"구역계 후보 3안 면적 계산(10/8, 도로 중심선·가구 단위)","next":"10/15 구역계 선택 → 지적도로 경계 확정(전자도면 SHP)","who":"함께"},{"id":"r4","icon":"img/req_vacancy.webp","kind":"필수","title":"공실상가 10호 이상 (한 노선의 주요 가로)","page":27,"rule":"구역 안 주요 가로(연결된 1개 노선)에 접한 공실상가가 10호 이상이어야 합니다. 부분 공실도 셉니다.","now":"시 우선순위 13곳 중 시 자료에 ‘1년 이상 공실’로 표기된 곳은 5곳(상가 11칸)이며, 나머지는 공실 여부를 협의·확인 중입니다. 연결된 1개 노선(봉황대길)에 접한 공실이 10호 이상 배치되는지, ‘호’의 산정 단위(가이드라인은 부분공실 포함)를 어떻게 적용할지 확인이 필요합니다.","status":"ing","evidence":"김해시 대상지 목록(10/8) 메모, 현장 답사(10/8)","next":"13곳 층·호·면적·공실 시작 시점 표 작성, 봉황대길 노선 위 10호 배치 확인 · ①안 점포 213곳 전수조사(건물·층·호 단위, 반복조사 → 계획서 별지 제1호)","who":"김해시 · 용역사"},{"id":"r5","icon":"img/req_vacancy.webp","kind":"필수","title":"2026년 1월 1일 이전부터 공실","page":27,"rule":"2026.1.1 이전부터 비어 있던 상가여야 하며, 준공 후 한 번도 쓰지 않은 곳은 제외됩니다.","now":"시 자료에 ‘1년 이상 공실’로 표기된 5곳은 요건에 해당할 가능성이 있으나, 공실 시작 시점을 입증할 자료는 아직 확보되지 않았습니다.","status":"chk","evidence":"시 메모(10/8)","next":"곳별 공실 시작 시점 확인(소유자·중개업소·사용량 기록)","who":"김해시","risk":"5번(15-2)은 2022년 사용승인 건물이라, ‘준공 후 계속 공실’이 아님을 영업 이력(사업자등록·폐업 시점)으로 증빙해야 10호에 넣을 수 있습니다."},{"id":"r6","icon":"img/req_right.webp","kind":"필수","title":"공실 증빙 3종 중 2종","page":27,"rule":"①수도·전기 사용량 기준 이하 ②사업자등록·카드매출 등 영업자료 없음 ③1년 단위 현장조사에서 반복 미사용 — 이 가운데 2개 이상을 증빙해야 합니다.","now":"시 메모에 공실 정황이 적힌 곳이 있으나, 정식 증빙 자료는 아직 모으지 않았습니다. 상가 임대차계약 자료는 증빙으로 인정되지 않습니다.","status":"no","evidence":"가이드라인(안) 27쪽","next":"수도·전기 사용량 확인 방법(상수도사업소·한전 협조)과 영업자료 조회 방법 정하기","who":"김해시"},{"id":"r7","icon":"img/req_right.webp","kind":"필수","title":"공실상가 권원 확보 (10호 이상)","page":[15,32],"rule":"신청 때 바로 쓸 수 있는 10호 이상을 확보해야 합니다. 조건부 계약·상생협약 상태라면 최종평가 전까지 최종 권원을 확보해야 합니다.","now":"시가 컨설팅 전까지 조건부 매매계약서·임대차 협약서를 확보하기로 했습니다(10/8). 곳별 권원 확보 협의가 진행 중입니다.","status":"ing","evidence":"10/8 현장 미팅 결정","next":"곳별 조건부 매매계약·임대차 협약 진행 현황표 관리","who":"김해시"},{"id":"r8","icon":"img/req_area.webp","kind":"필수","title":"기존 도시재생사업과 겹치지 않기","page":[12,28],"rule":"국비 지원이 끝나지 않은 기존 선정지역은 제외됩니다. 끝났더라도 이번 신청지역과 과거 국비 투입지역을 구분할 수 있어야 합니다.","now":"과거 원도심 도시재생사업은 국비 정산이 끝났다고 전달받았습니다(선정 연도 2016·2017 기록이 엇갈려 시 원자료 확인 필요). 과거 국비 투입 위치와 이번 구역계를 겹쳐 보여 주는 도면이 아직 없습니다.","status":"ing","evidence":"시 담당 확인(8/13), 경남도 협의(9/8)","next":"과거 국비 투입 위치·금액 자료를 받아 새 구역계와 분리 도면 작성","who":"김해시(도시재생) · 용역사"},{"id":"r9","icon":"img/req_org.webp","kind":"필수","title":"상위계획 정합성·활성화지역 절차","page":12,"rule":"활성화지역이 아니면 전략계획 변경으로 새로 지정하거나 선도지역 지정이 필요합니다. 기존 활성화계획 지역은 신청지역을 제척해야 합니다.","now":"새 구역계가 정해지면 전략계획 변경 필요 여부를 판단할 수 있습니다.","stat tatus":["대상지(후보): 시 우선순위 13곳(매매 8·임대 5). 핵심 거점은 5번 봉황동 15-2 건물(3층 공실)과 인접 10번 봉황동 23-3 부지(주차장 후보)로 검토 중(권원 확보·주차장 지정 확인 필요)","구역계: 후보 3안 검토 중 — ①안 145,620㎡(권장 면적 이내·13곳 모두 포함), ②안 177,371㎡·③안 190,221㎡(권장 초과). 10/15 실무회의에서 선택 예정","추진 방향(10/8 협의): 봉황대길(봉리단길) 중심, 방문객 이용 공간 10곳(전시·판매·팝업) 조성, 개인 작업실은 자체 지방비로 별도 확보","쇠퇴 요건: 원도심 3동 사업체 수 감소(2021→2024 −5.4%, 3년 연속)·노후건축물 비율 93.3%(①안 기준)로 3개 요건 중 2개 충족(용역사 분석, 신청 시 별첨 양식으로 재산정)"],"next":["김해시: 문화예술인·단체 목록 전달(10/12), 조건부 매매계약서·임대차 협약서 확보, 공실 증빙 자료(수도·전기 사용량 등) 수집, 사전컨설팅 일정 공문 확인","용역사: 사업계획서 초안(공간·콘텐츠 연계) 작성, 마스터플랜·방향성 자료(10/15), 입주자 선발·운영 기준 초안","김해시·용역사 공동: 구역계·주력 문화 장르·10곳 구성 확정(10/15), 사전컨설팅 자료 준비(컨설팅 약 1주 전 마감)"]},"docs":[{"id":"guide91","title":"가이드라인(안) 설명회본 91쪽","path":"docs/guideline_91p.pdf"},{"id":"guide92","title":"가이드라인(안) 9/9 수령본 92쪽","path":"docs/guideline_92p.pdf"}],"tour":[{"img":"img/sec_guide.webp","k":"1 / 7 · 어떤 사업?","title":"빈 상가를 다시 채우는 시범사업","text":"원도심의 오래 빈 상가를 고쳐 청년·예술인·창업인이 일하고 파는 공간으로 바꿉니다. 국토부(공간)·문체부(콘텐츠)·중기부(창업)가 한 지역에 함께 지원합니다.","route":"guide","cta":"사업 쉽게 이해하기"},{"img":"img/kpi_money.webp","k":"2 / 7 · 얼마나?","title":"국비 최대 242.4억 · 총 364.8억 · 4년","text":"국토부 사업은 국비 70%·지방비 30%, 문체부 두 사업은 50%씩입니다. 상생형 임대료는 최대 90%까지 지원할 수 있습니다.","route":"guide","cta":"지원 구조 보기"},{"img":"img/sec_check.webp","k":"3 / 7 · 무엇이 필요?","title":"15만㎡ 이내, 공실 10호 이상","text":"2026년 1월 1일 이전부터 비어 있던 상가 10호 이상을 한 노선 가로에 확보하고, 권원·10년 운영 계획을 갖춰야 합니다. 신청 전 사전컨설팅 4회가 필수입니다.","route":"check","cta":"요건 점검표 보기"},{"img":"img/sec_map.webp","k":"4 / 7 · 김해는 어디?","title":"봉황동 봉리단길 일대, 시 우선순위 13곳","text":"시가 정한 13곳을 모두 담는 구역계 ①안(14.6만㎡)이 기본안이고, 봉리단길 전체를 담는 ②·③안을 함께 비교합니다.","route":"sites","cta":"대상지 지도 보기"},{"img":"img/sec_plan.webp","k":"5 / 7 · 무엇을 채우나?","title":"핵심 거점 1곳 + 방문객 공간 10곳","text":"문 닫은 3층 건물(15-2)을 거점으로, 빈 점포 10곳은 전시·판매·팝업 공간으로 짭니다. 넣을 문화 콘텐츠는 후보 30개를 정리해 두었습니다.","route":"plan","cta":"구상 보기"},{"img":"img/sec_todo.webp","k":"6 / 7 · 다음은?","title":"","text":"","route":"todo","cta":"할 일·일정 보기","dynamic":"schedule"},{"img":"img/sec_library.webp","k":"7 / 7 · 보고는?","title":"보고용 1장·문장 복사·엑셀·달력","text":"A4 한 장 요약을 인쇄하거나, 보고용 문장을 복사하고, 요건 점검표(엑셀)와 일정(달력 파일)을 내려받을 수 있습니다.","route":"brief","cta":"보고용 1장 열기"}],"page_summary":{"guide":["국토부·문체부·중기부가 공간·콘텐츠·창업을 나눠 맡아 원도심 한 곳을 함께 지원하는 4년 시범사업입니다.","지역당 국비는 최대 242.4억원, 지방비를 더하면 364.8억원이며 2027년 전국 7곳을 권역별 1곳씩 뽑을 예정입니다.","핵심 요건은 15만㎡ 이내 구역과 2026년 1월 1일 이전부터 비어 있던 공실상가 10호 이상 확보입니다."],"check":["신청 요건 17개 가운데 충족 1 · 진행·확인 중 10 · 미충족 6입니다.","가장 급한 것은 공실 증빙과 공실상가 권원 확보입니다. 증빙은 수도·전기 사용량 등으로, 권원은 조건부 계약·협약으로 합니다.","줄을 누르면 가이드라인 기준·김해 근거·다음 할 일·담당이 펼쳐지고, 엑셀로 내려받을 수 있습니다."],"sites":["김해시 우선순위 13곳은 봉황동 봉리단길(봉황대길) 일대에 모여 있습니다.","구역계는 ①안이 기본입니다. 145,620㎡로 권장 면적 안에 들고, 10/15 실무회의에서 ②·③안과 비교해 고릅니다.","핵심 거점은 5번(15-2) 3층 건물과 10번(23-3) 주차 후보 부지입니다(권원 확보 협의 필요)."],"field":["주민·상인 약 50명은 좁은 길·주차, 어두운 골목, 머물 거리 부족을 가장 많이 말했습니다.","원도심 3동은 사업체 수 −5.4%, 노후건축물 93.3%로 쇠퇴 요건 2개를 충족합니다.","숫자마다 계산 방법과 출처를 달아 보고서에 그대로 인용할 수 있습니다."],"log":["8월 착수 이후 현장실사 → 도청 협의 → 발주처 협의 → 설명회 → 현장 실무회의를 거쳤습니다.","대상지는 약 50만㎡ 구상에서 15만㎡ 안팎, 봉황동 13곳 중심으로 좁혀졌습니다.","바뀐 결정도 이력으로 남겨, 왜 지금 방향이 되었는지 따라갈 수 있습니다."],"plan":["10/8 현장 실무회의에서 봉리단길 중심·방문객 공간 10곳·핵심 거점 묶음 방향을 정했습니다.","국토부 공간 사업, 문체부 콘텐츠 사업, 중기부 창업 지원을 한 흐름으로 잇는 계획을 세웁니다.","주력 문화 장르와 10곳 구성은 10/15 실무회의에서 함께 정합니다."],"todo":["다음 일정: 10/12 시 자료 전달 → 10/15 2차 실무회의(13:00) → 10/20 컨설팅 자료 마감(목표).","할 일을 김해시 · 용역사 · 공동으로 나눴고, 시에서 준비해 주실 자료를 표로 정리했습니다.","‘일정을 내 달력에 넣기’로 휴대전화·업무용 달력에 바로 넣을 수 있습니다."],"library":["가이드라인 원문과 보고서·조사표·제안서·분석 지도 등 14건을 모았습니다.","미리보기를 누르면 크게 보이고, 단추로 열거나 내려받을 수 있습니다.","보고용 1장은 인쇄·PDF 저장과 메신저용 글 복사를 지원합니다."]},"meetings":[{"date":"2026-08-27","title":"김해시 현장실사","place":"김해 원도심 사업 대상지 일원","who":"김해시 도시재생 담당, 용역 수행팀","points":["빈집·빈 점포를 매입·임차해 청년·문화·창업 기능을 넣는 국토부·문체부·중기부 연계사업으로 설명","검토 구역 약 50만㎡·건물 약 1,700동·영업 점포 약 1,600개·20년 이상 노후 약 90%(현장 설명 기준)","A 청년 미식·B 가야문화·체험·C 다문화 생활 권역 구상은 긍정 평가, 개소 수·수요·운영주체 구체화 요구","B권역 체류형 숙박 15개소 안은 수요·운영성 검증 후 공방·체험 기능으로 대체 검토","예식장·공구상가 등 대형 공실을 권역 연결 거점 후보로 검토, 세 부처 사업을 권역 안에서 이어지게 구성 요구"],"decided":["3개 권역 구상 유지, 약 25만㎡ 축소안은 확정하지 않고 사업량 산정 후 협의 결과에 따라 조정","권역별 사업명·위치·개소 수·수요·운영주체·전환 물량을 다음 주까지 구체화(수행팀)","부처별 사업의 권역 대응표를 작성하고 그다음 주 지원기관 방문 협의 준비"],"later":"9/10 협의에서 가이드라인(안) 기준 15만㎡·B권역 중심으로 축소 검토 방향 정리"},{"date":"2026-09-08","title":"경상남도 도청 협의","place":"경상남도청","who":"경남도 도시재생 관련 부서 관계자, 김해시 담당, 용역 수행팀","points":["C권역이 과거 활성화구역과 겹친다는 문제 제기, 중복 시 재선정이 어려울 수 있다는 구두 의견 전달(확정 지침 아님)","'왜 김해·왜 이 원도심인가' 필요성·명분 보강과 국토부·문체부·중기부 목적에 맞는 사업 아이템 구체화 요청","핵심사업이 한눈에 들어오지 않는다는 지적, 공유주방·영상 제작은 문체부 콘텐츠 사업으로 구체화 가능하다는 의견","신축 없이 기존 건물 매입·임대 중심의 계획안 제시, 운영기관 3곳 연계는 제안 단계(기관 확약 아님)","(후속 정리) 과거 투자구간·미투입 구간·시 자체사업을 지도화해 반복투자가 아님을 증명하기로"],"decided":["9/10 HUG 협의에서 기존 활성화구역 중복 허용 여부를 먼저 확인, 불명확하면 국토부에 직접 확인","9/10 전까지 필요성·명분, 부처별 사업 아이템, 핵심사업 전달력 세 가지를 우선 보완","원도심 유지안과 함께 내외동 일대 대안 1장을 병행 준비, 확인 결과에 따라 유지·전환 결정"],"later":"9/9 가이드라인(안)과 9/10 국토부 측 의견(국비 정산 완료·구역 분리 시 가능)에 따라 원도심 유지로 진행"},{"date":"2026-09-10","title":"발주처 본미팅(국토부 지침 담당 참석)","place":"","who":"김해시 국장·과장급과 실무 담당, 경남도 측, 국토부 측(지침 담당), 용역 수행팀","points":["국토부 측 안내: 신청 시 즉시 활용 가능한 공실 10호 이상 확보 여부를 필수 요건(pass/fail)으로 본다는 설명","공실은 2026.1.1 이전부터 비어 있는 상가(근생·문화·업무 등), 주택·준공 후 미분양은 제외라는 안내","상생협약형(10년 이상 계약) 권고, 사업기간 임대료 최대 90%·상생형 리모델링비 10% 지원은 가이드라인(안) 기준","선행 도시재생사업은 국비 정산이 끝나 협의 후 중복이 아니면 신청 가능하다는 국토부 측 의견","일정 안내: 2027.1 신청→2월 평가 전 권원 확보→하반기 입주, 경남도 측: 도 컨설팅 11월 초·12월 초"],"decided":["대상지를 가이드라인(안) 기준 15만㎡로 축소하고 B권역 중심으로 재검토(당초 약 50만㎡)","기존 국비 투입 구역을 도면으로 구분·제척한 구역계를 다시 설정","신청 시 즉시 활용 가능한 공실 10호 이상 확보, 매입·직접임대·상생협약을 조합","'공실 약 350개' 수치는 그대로 쓰지 않고 전수조사 후 선별"],"later":"9/17 설명회에서 가이드라인(안) 수치 재확인, 구역계는 9/30 B권역 15.6ha 채택 후 10월 봉황동 일대로 재검토 중"},{"date":"2026-09-17","title":"대전 RE:CORE 설명회","place":"대전","who":"국토부·문체부 합동 설명회, 용역 수행팀 참석","points":["대상지 요건: 비수도권 원도심, 쇠퇴요건 2개 이상, 15만㎡ 이내 권고, 주요 가로 공실 10호 이상(설명회 안내)","공실 상세 기준은 2026.1.1 이전부터 공실, 기존 국비 지원지역은 지원 종료·신규 투자구간 구분이 명확해야 신청 가능","선정·일정: 2027년 권역별 1곳 총 7곳, 12월 공고→1월 접수→2월 선정, 사전 상담 4회(HUG 3·문체부 1)","사업비: 지역당 국비 242.4억(지방비 포함 364.8억)·최대 4년, 국토부 7:3·문체부 5:5 매칭(PDF 확인)","상생형: 사업
